[LOGS]
; ============================
; CONTROL GENERAL DE LOGS
; 0 = desactiva todos los logs del cliente
; ============================
EnableLogs=1        

; ============================
; LOGS DE GRAFICOS (DX8)
; ============================
EnableDrawGrh=1
EnableDibujaPJ=1
EnableMapaDibuja=1
EnableRenderScreen=1
EnableAnimaciones=1
EnableDX8Debug=1

; ============================
; LOGS DE MAPA
; ============================
EnableMapaCarga=1
EnableMapaDibuja=1
EnableMapaTransiciones=0

; ============================
; LOGS DE RED (TCP)
; ============================
EnableTCP_Conexiones=1
EnableTCP_Paquetes=0
EnableTCP_Errores=1

; ============================
; LOGS DE INVENTARIO / OBJETOS
; ============================
EnableInventario=1
EnableItems=1
EnableHechizos=0

; ============================
; LOGS DE USUARIO
; ============================
EnableUserLogin=1
EnableUserAcciones=1
EnableUserDebug=0

; ============================
; LOGS DE SISTEMA
; ============================
EnableErrores=1
EnableCriticos=1
EnableWarnings=1
EnableDebugGeneral=0

; ============================
; AÑADE TUS PROPIOS LOGS
; ============================
; EnableMiLogPersonal=1


